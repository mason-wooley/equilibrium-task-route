<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RuneScape Leagues Tasks</title>

    <link rel="stylesheet" href="https://use.typekit.net/hzd6zjt.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">

        <div class="header-content">

            <h1>Leagues II: Equilibrium — Route</h1>

            <div class="progress">

                <div class="stat-card">
                    <span class="stat-label">Tasks Completed</span>
                    <span id="completedCount" class="stat-value">0</span>
                </div>

                <div class="stat-card">
                    <span class="stat-label">League Points</span>
                    <span id="leaguePoints" class="stat-value">0</span>
                </div>

                <button id="resetButton" class="reset-button">
                    Reset All Tasks
                </button>

            </div>

        </div>

    </header>


    <main class="main-content">

        <div id="taskList" class="task-list"></div>

    </main>


    <script src="script.js"></script>

</body>

</html>
